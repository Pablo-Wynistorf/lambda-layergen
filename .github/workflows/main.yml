name: Build Binary and Create Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest  # Use a clean Ubuntu environment for building

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install click
          pip install tabulate

      - name: Build binary
        working-directory: ./src
        run: |
          sed -i "s/layergen_version/v1.0.${{ github.run_number }}/" layergen.py
          pyinstaller --onefile --hidden-import=click --no-upx layergen.py

      - name: Move binary to root directory
        run: |
          mv src/dist/* ./layergen

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          release_name: "Release v1.0.${{ github.run_number }}"
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./layergen
          asset_name: layergen
          asset_content_type: application/octet-stream
