name: Build Binary and Create Release

on:
  push:
    branches:

      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:

          - os: ubuntu-latest
            arch: amd64
            artifact_name: layergen-linux-amd64

          - os: ubuntu-24.04-arm
            arch: arm64
            artifact_name: layergen-linux-arm64

    steps:

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install click
          pip install tabulate

      - name: Build binary
        working-directory: ./src
        run: |
          pyinstaller --onefile --hidden-import=click --hidden-import=tabulate --hidden-import=shutil --hidden-import=json --hidden-import=uuid --hidden-import=re --hidden-import=os --hidden-import=subprocess --hidden-import=sys layergen.py

      - name: Move binary to root directory
        run: |
          mv src/dist/layergen ./${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Make binaries executable
        run: |
          chmod +x ./artifacts/layergen-linux-amd64/layergen-linux-amd64
          chmod +x ./artifacts/layergen-linux-arm64/layergen-linux-arm64

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ github.run_number }}
          release_name: "Release v1.0.${{ github.run_number }}"
          draft: false
          prerelease: false

      - name: Upload amd64 binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/layergen-linux-amd64/layergen-linux-amd64
          asset_name: layergen-linux-amd64
          asset_content_type: application/octet-stream

      - name: Upload arm64 binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/layergen-linux-arm64/layergen-linux-arm64
          asset_name: layergen-linux-arm64
          asset_content_type: application/octet-stream
